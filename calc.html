<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계산기</title>
  <style>
    :root {
      --bg-color: #121826;
      --calc-bg: #1e293b;
      --display-bg: #0f172a;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --btn-num: #334155;
      --btn-num-hover: #475569;
      --btn-func: #475569;
      --btn-func-hover: #64748b;
      --btn-op: #f59e0b;
      --btn-op-hover: #d97706;
      --btn-equal: #3b82f6;
      --btn-equal-hover: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .calculator {
      width: 100%;
      max-width: 360px;
      background-color: var(--calc-bg);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .display {
      background-color: var(--display-bg);
      border-radius: 16px;
      padding: 20px 16px;
      text-align: right;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 96px;
      overflow: hidden;
    }

    .previous-operand {
      color: var(--text-sub);
      font-size: 1rem;
      min-height: 1.4rem;
      word-break: break-all;
    }

    .current-operand {
      color: var(--text-main);
      font-size: 2.4rem;
      font-weight: 700;
      word-break: break-all;
      line-height: 1.2;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 64px;
      border: none;
      border-radius: 16px;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.15s, transform 0.08s;
      outline: none;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-num {
      background-color: var(--btn-num);
    }
    .btn-num:hover {
      background-color: var(--btn-num-hover);
    }

    .btn-func {
      background-color: var(--btn-func);
      color: #e2e8f0;
      font-size: 1.2rem;
    }
    .btn-func:hover {
      background-color: var(--btn-func-hover);
    }

    .btn-op {
      background-color: var(--btn-op);
      color: #ffffff;
      font-size: 1.5rem;
    }
    .btn-op:hover {
      background-color: var(--btn-op-hover);
    }
    .btn-op.active {
      filter: brightness(1.2);
      border: 2px solid #ffffff;
    }

    .btn-equal {
      background-color: var(--btn-equal);
      color: #ffffff;
      font-size: 1.6rem;
    }
    .btn-equal:hover {
      background-color: var(--btn-equal-hover);
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="display">
      <div class="previous-operand" id="previous-operand"></div>
      <div class="current-operand" id="current-operand">0</div>
    </div>
    <div class="keypad">
      <button class="btn-func" data-action="clear">AC</button>
      <button class="btn-func" data-action="delete">⌫</button>
      <button class="btn-func" data-action="percent">%</button>
      <button class="btn-op" data-operator="÷">÷</button>

      <button class="btn-num" data-number="7">7</button>
      <button class="btn-num" data-number="8">8</button>
      <button class="btn-num" data-number="9">9</button>
      <button class="btn-op" data-operator="×">×</button>

      <button class="btn-num" data-number="4">4</button>
      <button class="btn-num" data-number="5">5</button>
      <button class="btn-num" data-number="6">6</button>
      <button class="btn-op" data-operator="-">-</button>

      <button class="btn-num" data-number="1">1</button>
      <button class="btn-num" data-number="2">2</button>
      <button class="btn-num" data-number="3">3</button>
      <button class="btn-op" data-operator="+">+</button>

      <button class="btn-func" data-action="toggle-sign">±</button>
      <button class="btn-num" data-number="0">0</button>
      <button class="btn-num" data-number=".">.</button>
      <button class="btn-equal" data-action="calculate">=</button>
    </div>
  </div>

  <script>
    let currentInput = '0';
    let previousInput = '';
    let operator = null;
    let shouldResetInput = false;

    const currentOperandEl = document.getElementById('current-operand');
    const previousOperandEl = document.getElementById('previous-operand');
    const operatorButtons = document.querySelectorAll('.btn-op');

    function updateDisplay() {
      currentOperandEl.textContent = formatNumber(currentInput);
      if (operator) {
        previousOperandEl.textContent = `${formatNumber(previousInput)} ${operator}`;
      } else {
        previousOperandEl.textContent = '';
      }

      operatorButtons.forEach(btn => {
        if (operator && btn.dataset.operator === operator && shouldResetInput) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function formatNumber(numStr) {
      if (numStr === '오류') return numStr;
      if (!numStr) return '';
      const parts = numStr.split('.');
      const integerPart = parts[0];
      const decimalPart = parts[1];
      
      const formattedInt = Number(integerPart).toLocaleString('ko-KR');
      if (decimalPart !== undefined) {
        return `${formattedInt}.${decimalPart}`;
      }
      return formattedInt;
    }

    function appendNumber(number) {
      if (currentInput === '오류') {
        currentInput = '0';
      }
      if (shouldResetInput) {
        currentInput = number === '.' ? '0.' : number;
        shouldResetInput = false;
        return;
      }
      if (number === '.' && currentInput.includes('.')) return;
      if (currentInput === '0' && number !== '.') {
        currentInput = number;
      } else {
        if (currentInput.replace('.', '').length >= 12) return;
        currentInput += number;
      }
    }

    function chooseOperator(op) {
      if (currentInput === '오류') return;
      if (operator && !shouldResetInput) {
        compute();
      }
      operator = op;
      previousInput = currentInput;
      shouldResetInput = true;
    }

    function compute() {
      if (!operator || shouldResetInput) return;
      const prev = parseFloat(previousInput);
      const current = parseFloat(currentInput);
      if (isNaN(prev) || isNaN(current)) return;

      let result;
      switch (operator) {
        case '+':
          result = prev + current;
          break;
        case '-':
          result = prev - current;
          break;
        case '×':
          result = prev * current;
          break;
        case '÷':
          if (current === 0) {
            currentInput = '오류';
            previousInput = '';
            operator = null;
            shouldResetInput = true;
            return;
          }
          result = prev / current;
          break;
        default:
          return;
      }

      result = parseFloat(result.toPrecision(12));
      currentInput = String(result);
      operator = null;
      previousInput = '';
      shouldResetInput = true;
    }

    function clearAll() {
      currentInput = '0';
      previousInput = '';
      operator = null;
      shouldResetInput = false;
    }

    function deleteLast() {
      if (currentInput === '오류' || shouldResetInput) {
        clearAll();
        return;
      }
      if (currentInput.length === 1 || (currentInput.length === 2 && currentInput.startsWith('-'))) {
        currentInput = '0';
      } else {
        currentInput = currentInput.slice(0, -1);
      }
    }

    function toggleSign() {
      if (currentInput === '오류' || currentInput === '0') return;
      if (currentInput.startsWith('-')) {
        currentInput = currentInput.slice(1);
      } else {
        currentInput = '-' + currentInput;
      }
    }

    function applyPercent() {
      if (currentInput === '오류') return;
      const val = parseFloat(currentInput);
      if (isNaN(val)) return;
      currentInput = String(parseFloat((val / 100).toPrecision(12)));
    }

    document.querySelector('.keypad').addEventListener('click', (e) => {
      const target = e.target.closest('button');
      if (!target) return;

      if (target.dataset.number !== undefined) {
        appendNumber(target.dataset.number);
      } else if (target.dataset.operator !== undefined) {
        chooseOperator(target.dataset.operator);
      } else if (target.dataset.action === 'calculate') {
        compute();
      } else if (target.dataset.action === 'clear') {
        clearAll();
      } else if (target.dataset.action === 'delete') {
        deleteLast();
      } else if (target.dataset.action === 'toggle-sign') {
        toggleSign();
      } else if (target.dataset.action === 'percent') {
        applyPercent();
      }
      updateDisplay();
    });

    window.addEventListener('keydown', (e) => {
      if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
        appendNumber(e.key);
      } else if (e.key === '+') {
        chooseOperator('+');
      } else if (e.key === '-') {
        chooseOperator('-');
      } else if (e.key === '*') {
        chooseOperator('×');
      } else if (e.key === '/') {
        e.preventDefault();
        chooseOperator('÷');
      } else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        compute();
      } else if (e.key === 'Backspace') {
        deleteLast();
      } else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') {
        clearAll();
      } else if (e.key === '%') {
        applyPercent();
      }
      updateDisplay();
    });

    updateDisplay();
  </script>
</body>
</html>
